    <h1>Менің сүйікті комикс кейіпкерім: Бэтмен</h1>
    <p>Бэтмен — Готэм қаласының қорғаушысы, қараңғы сергелдең және суперқабілеті жоқ болса да, ақыл-ойы мен технологияның арқасында қылмыспен күресетін кейіпкер.</p>
